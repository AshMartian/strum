name: Worker contract and installed runtime

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev]'
      - name: Contract, training, profile, and wheel tests
        env:
          WANDB_MODE: disabled
          OMP_NUM_THREADS: '2'
        run: python -m pytest -q
